apiVersion : apps/v1
kind : Deployment
metadata: 
  name : api-deployment
spec : 
  replicas : 2
  selector :
    matchLabels :
      app : zero-trust-api
  template : 
    metadata :
      labels :
        app : zero-trust-api
    spec : 
      containers :
      - name : api
        image : zero-trust-api:latest
        imagePullPolicy: Never
        ports :
        - containerPort : 5000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
    